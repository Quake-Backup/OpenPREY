// openPR06's default controller bindings, run after Prey's default.cfg
// (which binds only the keyboard and mouse) when the bindings start fresh:
// a first launch and Options > Reset Defaults > Controls. A player's own
// bindings in their config are left alone.
//
// SDL gamepads map as:
// JOY1 LB, JOY2 RB, JOY3 A, JOY4 B, JOY5 Y, JOY6 X, JOY7 Start, JOY8 Back,
// JOY9 D-pad Up, JOY10 D-pad Down, JOY11 D-pad Right, JOY12 D-pad Left,
// JOY13 L3, JOY14 R3, JOY15 RT, JOY16 LT, JOY17 Guide, JOY18 Touchpad,
// JOY19 Right paddle 1, JOY20 Left paddle 1, JOY21 Right paddle 2, JOY22 Left paddle 2.
// Start and Back open the menu and are not bound here.

bind	JOY15			_attack					// Attack (RT)
bind	JOY16			_attackAlt				// Alternate attack (LT)
bind	JOY3			_moveUp					// Jump (A)
bind	JOY4			_moveDown				// Crouch (B)
bind	JOY6			_impulse16				// Lighter (X)
bind	JOY5			_impulse54				// Spirit walk (Y)
bind	JOY1			_impulse15				// Previous weapon (LB)
bind	JOY2			_impulse14				// Next weapon (RB)
bind	JOY9			_impulse25				// Throw a crawler grenade (D-pad Up)
bind	JOY10			_zoom					// Zoom view (D-pad Down)
bind	JOY11			_impulse14				// Next weapon (D-pad Right)
bind	JOY12			_impulse15				// Previous weapon (D-pad Left)
bind	JOY13			_speed					// Walk / run (L3)
bind	JOY14			_impulse18				// Center view (R3)
bind	JOY18			_impulse19				// Scoreboard (touchpad)
bind	JOY19			_moveUp					// Jump (right paddle 1)
bind	JOY20			_moveDown				// Crouch (left paddle 1)
bind	JOY21			_impulse16				// Lighter (right paddle 2)
bind	JOY22			_impulse54				// Spirit walk (left paddle 2)
